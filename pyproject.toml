[project]
name = "ATG-lib"
version = "1.6.0"
description = "Python library to process solo queue game data with comprehensive database models to additionally store LoL Esports data"
authors = [{ name = "Allan Cao", email = "allan@allancao.ca" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["lol-esports", "riot-games-api"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.41,<3.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "psycopg[binary]>=3.2.9,<4.0.0",
    "httpx2>=2.14.0",
]

[project.urls]
Repository = "https://github.com/Allan-Cao/ATG.git"
Issues = "https://github.com/Allan-Cao/ATG/issues"

[dependency-groups]
dev = [
    "python-dotenv>=1.1.0,<2.0.0",
    "alembic>=1.16.2,<2.0.0",
    "black>=25.1.0,<27.0.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ATG"
module-root = ""

[[tool.uv.index]]
name = "ATG-lib"
url = "https://pypi.org/simple"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true

